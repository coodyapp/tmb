name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Package & publish
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # package.sh derives the build number from rev-list and the version
          # from the tag, so it needs full history.
          fetch-depth: 0

      - name: Validate release configuration
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
          AC_APPLE_ID: ${{ secrets.AC_APPLE_ID }}
          AC_TEAM_ID: ${{ secrets.AC_TEAM_ID }}
          AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must use vMAJOR.MINOR.PATCH."
            exit 1
          }
          configured=0
          for secret in "$CERT_P12" "$CERT_PASSWORD" "$DEVELOPER_ID_APP" "$AC_APPLE_ID" "$AC_TEAM_ID" "$AC_PASSWORD"; do
            [[ -n "$secret" ]] && ((configured += 1))
          done
          [[ "$configured" == 0 || "$configured" == 6 ]] || {
            echo "Developer ID signing requires all six signing/notarization secrets, or none."
            exit 1
          }
          if [[ "$configured" == 6 ]]; then
            echo "Publishing a Developer ID-signed and notarized release."
          else
            echo "Publishing an ad-hoc release; Developer ID signing is planned for 2027."
          fi

      - name: Test (release configuration)
        run: swift test -c release --package-path apps/menubar

      - name: Install create-dmg
        # Styled drag-to-Applications DMG; package.sh falls back to a plain
        # DMG if this is missing or create-dmg fails on the headless runner.
        run: brew install create-dmg

      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          if [[ -z "$CERT_P12" ]]; then
            echo "No Developer ID certificate configured; packaging ad-hoc."
            exit 0
          fi
          # A throwaway keychain scoped to this runner: never touches login.keychain.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # Lets codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Package app + DMG
        env:
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
          AC_APPLE_ID: ${{ secrets.AC_APPLE_ID }}
          AC_TEAM_ID: ${{ secrets.AC_TEAM_ID }}
          AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          apps/menubar/Scripts/package.sh "$VERSION"
          shasum -a 256 "apps/menubar/dist/TokenMyBar-$VERSION.dmg" | tee "apps/menubar/dist/TokenMyBar-$VERSION.dmg.sha256"

      - name: Verify signature and notarization
        env:
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          codesign --verify --strict --verbose=2 "apps/menubar/dist/TokenMyBar.app"
          if [[ -n "$DEVELOPER_ID_APP" ]]; then
            # Gatekeeper's own verdict, not merely a well-formed signature.
            spctl --assess --type execute --verbose=4 "apps/menubar/dist/TokenMyBar.app"
            xcrun stapler validate "apps/menubar/dist/TokenMyBar-$VERSION.dmg"
          else
            echo "Ad-hoc build: skipping Gatekeeper and staple checks."
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSETS=(
            "apps/menubar/dist/TokenMyBar-$VERSION.dmg"
            "apps/menubar/dist/TokenMyBar-$VERSION.dmg.sha256"
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Tag was re-pushed: refresh the assets on the existing release.
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
              --title "TokenMyBar $VERSION" \
              --generate-notes \
              --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for details."
          fi
